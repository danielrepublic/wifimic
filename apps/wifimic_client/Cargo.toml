[package]
name = "wifimic_client"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[features]
windows = []

[dependencies]
thiserror = "2"
wifimic_diagnostics = { path = "../../crates/wifimic_diagnostics" }
wifimic_protocol = { path = "../../crates/wifimic_protocol" }
wifimic_update = { path = "../../crates/wifimic_update" }

[target.'cfg(windows)'.dependencies]
tray-icon = "0.24"
wasapi = "0.23"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_Com", "Win32_System_Ole", "Win32_System_TaskScheduler", "Win32_NetworkManagement_WindowsFirewall", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading", "Win32_System_StationsAndDesktops", "Win32_System_Registry", "Win32_UI_Shell", "Win32_Storage_FileSystem"] }
sha2 = "0.10"
zip = "2"

[build-dependencies]
embed-resource = "3.0"

[lints]
workspace = true

[dev-dependencies]
proptest = "1"
