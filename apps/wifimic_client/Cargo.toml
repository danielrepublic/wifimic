[package]
name = "wifimic_client"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[features]
windows = []

[dependencies]
thiserror = "2"
wifimic_diagnostics = { path = "../../crates/wifimic_diagnostics" }
wifimic_protocol = { path = "../../crates/wifimic_protocol" }

[target.'cfg(windows)'.dependencies]
tray-icon = "0.24"
wasapi = "0.23"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
embed-resource = "3.0"

[lints]
workspace = true

[dev-dependencies]
proptest = "1"
